name: Generate Academic CV PDFs

on:
  push:
    branches: [main]
    paths:
      - 'cv/index.html'
      - 'styles.css'
      - 'site.js'
      - 'scripts/build_cv_pdfs.py'
      - '.github/workflows/cv-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: academic-cv-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tooling
        run: python -m pip install --disable-pip-version-check playwright pypdf

      - name: Render English and Indonesian A4 CVs
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null; then
            export CHROME_BIN="$(command -v google-chrome)"
          elif command -v chromium >/dev/null; then
            export CHROME_BIN="$(command -v chromium)"
          else
            echo "No Chrome available on the runner" >&2
            exit 1
          fi
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/cv-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          python scripts/build_cv_pdfs.py

      - name: Commit updated PDF editions
        run: |
          set -euo pipefail
          git add cv/Hafidh-Khoerul-Fata-Academic-CV-EN.pdf cv/Hafidh-Khoerul-Fata-CV-Akademik-ID.pdf
          if git diff --cached --quiet; then
            echo "CV PDFs are unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update downloadable Academic CV PDFs"
          git push origin HEAD:main
